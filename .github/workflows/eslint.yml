name: ESLint

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "27 2 * * 6"

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install ESLint
        # Isolated prefix: root package.json pins win32-only rollup/oxide/lightningcss
        # packages, and its preinstall rejects npm. Installing here would EBADPLATFORM.
        run: |
          mkdir -p "$RUNNER_TEMP/eslint"
          npm install --prefix "$RUNNER_TEMP/eslint" --ignore-scripts \
            eslint@10 \
            @eslint/js@10 \
            @microsoft/eslint-formatter-sarif@3.1.0
          cat > "$RUNNER_TEMP/eslint/eslint.config.mjs" <<'EOF'
          import js from "@eslint/js";

          export default [
            {
              ignores: [
                "**/node_modules/**",
                "**/dist/**",
                "**/build/**",
                "**/.expo/**",
              ],
            },
            js.configs.recommended,
            {
              files: ["**/*.{js,mjs,cjs,jsx}"],
            },
          ];
          EOF

      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
          NODE_PATH: ${{ runner.temp }}/eslint/node_modules
        run: |
          "$RUNNER_TEMP/eslint/node_modules/.bin/eslint" . \
            --config "$RUNNER_TEMP/eslint/eslint.config.mjs" \
            --format @microsoft/eslint-formatter-sarif \
            --output-file eslint-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        if: hashFiles('eslint-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
